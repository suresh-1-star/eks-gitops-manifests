apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-master
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceName: "redis-master"
  replicas: 1
  selector:
    matchLabels:
      app: redis
      tier: master
  template:
    metadata:
      labels:
        app: redis
        tier: master
    spec:
      containers:
      - name: redis
        image: redis:7.2.4-alpine
        command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 15
          periodSeconds: 20
  volumeClaimTemplates: gp2
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: gp2
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis
    tier: master